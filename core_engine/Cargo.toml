[package]
name = "core_engine"
version = "0.2.0"
edition = "2021"
authors = ["LUNA Engineering Team"]
description = "Core Rust Engine & Adaptive Power Governor for LUNA Desktop Agent"

[lib]
name = "core_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
# PyO3 for Python FFI and bindings
pyo3 = { version = "0.20.0", features = ["extension-module", "abi3-py310"] }

# System monitoring for the Governor
sysinfo = "0.30.5"
nvml-wrapper = "0.9.0"

# Windows Accessibility, Input & Hooking
uiautomation = "0.3.0"
windows-sys = { version = "0.52.0", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_System_RemoteDesktop",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi"
] }
windows = { version = "0.52.0", features = ["Win32_System_Console", "Win32_Foundation"] }

# Cross-thread primitives and memory safety
parking_lot = "0.12.1"
once_cell = "1.19.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1.40"
