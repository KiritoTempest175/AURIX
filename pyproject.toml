[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aurix"
version = "0.2.0"
description = "Autonomous local-first desktop AI assistant"
requires-python = ">=3.10"

authors = [
    { name = "Huzaifa", email = "huzaifa@aurix.local" },
    { name = "Saad", email = "saad@aurix.local" },
    { name = "Zain", email = "zain@aurix.local" }
]

dependencies = [
    "PyYAML>=6.0",
    "tomli>=2.0; python_version < '3.11'",
    "pywinauto>=0.6.9; platform_system == 'Windows'",
    "pywin32>=306; platform_system == 'Windows'",
    "cryptography>=42.0.0",
    "psutil>=5.9.0",
]


[project.optional-dependencies]

voice = [
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6"
]

dev = [
    # Research and legacy test dependencies remain opt-in; not installed in
    # the packaged user-facing desktop worker.
    "chromadb>=0.4.24",
    "nomic>=3.0.0",
    "sentence-transformers>=2.5.1",
    "faiss-cpu>=1.7.4",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.28",
    "pandas>=2.2.0",
    "numpy>=1.26.4",
    "pyarrow",
    "tqdm>=4.66.2",
    "rich>=13.7.1",
    "duckdb>=1.0.0",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "black",
    "ruff",
    "maturin>=1.4.0",
    # Legacy engine tests only; not included in the inference-only installer.
    "torch>=2.2.0",
    "bitsandbytes",
    "transformers>=4.38.0",
    "datasets>=2.18.0"
]

gguf = ["llama-cpp-python>=0.3.0"]

# Installed inside packaged Windows desktop builds; no separate user pip setup.
desktop = [
    "pyautogui>=0.9.54; platform_system == 'Windows'",
    "sounddevice>=0.4.6; platform_system == 'Windows'",
    "faster-whisper>=1.0.0; platform_system == 'Windows'",
]

# Legacy research dependencies. AURIX's normal desktop workflow does not train.
training = [
    "torch>=2.2.0",
    "bitsandbytes",
    "transformers>=4.38.0",
    "datasets>=2.18.0",
    "unsloth",
    "trl"
]

gpu = ["llama-cpp-python>=0.3.0"]


[tool.setuptools.packages.find]
where = ["."]
include = [
    "ai_brain*",
    "ai_engine*",
    "data_pipeline*",
    "native_ui*",
    "security*"
]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]