[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aurix"
version = "0.1.0"
description = "Autonomous Native AI Desktop Agent & Continuous Learning System"
requires-python = ">=3.10"
authors = [
    { name = "Huzaifa", email = "huzaifa@aurix.local" },
    { name = "Saad", email = "saad@aurix.local" },
    { name = "Zain", email = "zain@aurix.local" }
]
dependencies = [
    "torch>=2.2.0",
    "unsloth",
    "bitsandbytes",
    "transformers>=4.38.0",
    "datasets>=2.18.0",
    "chromadb>=0.4.24",
    "nomic>=3.0.0",
    "sentence-transformers>=2.5.1",
    "faiss-cpu>=1.7.4",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.28",
    "pandas>=2.2.0",
    "numpy>=1.26.4",
    "pyarrow",
    "tqdm>=4.66.2",
    "rich>=13.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "black",
    "ruff",
    "maturin>=1.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_engine*", "data_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
