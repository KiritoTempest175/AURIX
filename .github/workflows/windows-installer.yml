name: Windows Installer Preview
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'installer/**'
      - 'frontend/src-tauri/**'
      - 'frontend/bridge_server.py'
      - 'frontend/src/**'
      - 'pyproject.toml'
concurrency:
  group: aurix-windows-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Upgrade npm to supported resolver
        run: npm install --global npm@11.6.0
      - name: Build bundled worker and Tauri installer
        shell: pwsh
        run: ./installer/build_windows.ps1
      - name: Test actual installed application without developer runtimes on PATH
        shell: pwsh
        run: ./installer/smoke_installed.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: aurix-windows-unsigned-preview
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            installer-smoke.json
          if-no-files-found: error

      # Publication is deliberately separate from build verification. A passing
      # artifact build is not clean-VM, microphone, signing or inference evidence.
