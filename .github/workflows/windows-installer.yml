name: Windows Installer Preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'installer/**'
      - 'frontend/src-tauri/**'
      - 'frontend/bridge_server.py'
      - 'frontend/src/**'
      - 'ai_engine/**'
      - 'ai_brain/**'
      - 'security/**'
      - 'native_ui/**'
      - 'core_engine/**'
      - 'pyproject.toml'
      - 'docs/USER_TEST_CHECKLIST.md'
concurrency:
  group: aurix-windows-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # only the installer workflow can publish preview release assets
  actions: read  # inspect exact-commit CI/security status before publication
jobs:
  bundle:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-preview]') }}
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Upgrade npm to supported resolver
        run: npm install --global npm@11.6.0
      - name: Build bundled worker and Tauri installer
        shell: pwsh
        run: ./installer/build_windows.ps1
      - name: Verify actual installed application without developer runtimes
        shell: pwsh
        run: ./installer/smoke_installed.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: aurix-windows-unsigned-preview
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            installer-smoke.json
          if-no-files-found: error

      - name: Require exact-commit CI and security success before publication
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-preview]')) }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($workflow in @('ci.yml', 'security.yml')) {
            $deadline = (Get-Date).AddMinutes(45)
            $passed = $false
            do {
              $json = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/$workflow/runs?per_page=20&head_sha=$env:GITHUB_SHA"
              if ($LASTEXITCODE -ne 0) { throw "Could not read $workflow checks" }
              $runs = ($json | ConvertFrom-Json).workflow_runs
              $check = $runs | Where-Object { $_.head_sha -eq $env:GITHUB_SHA -and $_.event -eq 'push' } | Select-Object -First 1
              if ($check -and $check.status -eq 'completed') {
                if ($check.conclusion -ne 'success') {
                  throw "$workflow failed for this commit: $($check.conclusion)"
                }
                $passed = $true
                break
              }
              Start-Sleep -Seconds 20
            } while ((Get-Date) -lt $deadline)
            if (-not $passed) { throw "Timed out waiting for $workflow success" }
            Write-Host "$workflow succeeded at commit $env:GITHUB_SHA"
          }

      # A preview release is published only for explicitly requested runs.
      # Push builds continue to produce CI artifacts without creating releases.
      - name: Publish versioned GitHub preview release
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-preview]')) }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content 'frontend/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          $tag = "v$version-preview.${{ github.run_number }}"
          $installerDir = 'target/release/bundle'
          $assets = @(
            Get-ChildItem -Path "$installerDir/nsis" -Filter '*.exe' -File -ErrorAction SilentlyContinue
            Get-ChildItem -Path "$installerDir/msi" -Filter '*.msi' -File -ErrorAction SilentlyContinue
          ) | Where-Object { $null -ne $_ }
          if ($assets.Count -eq 0) { throw 'No Windows installer was produced. Refusing to publish an empty release.' }
          $checksums = foreach ($asset in $assets) {
            $hash = (Get-FileHash -Path $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($asset.Name)"
          }
          $checksums | Set-Content -Path 'SHA256SUMS.txt' -Encoding utf8
          @'
          # AURIX 0.2 — LUNA voice & desktop-control testing preview

          Unsigned Windows build for hands-on testing, not a certified production release.

          Updated: safer WhatsApp recipient verification, stricter email draft
          validation, Windows female voice preference, spoken replies toggle,
          wake/mic coordination, CPU sampling stability, persisted Permissions
          panel, and refreshed AURIX branding.

          Full manual acceptance checklist: docs/USER_TEST_CHECKLIST.md on main.

          **Install:** Download the .exe (NSIS installer) or .msi from Assets below. You do not need to install both.

          **First run:** AURIX launches a bundled local Python worker. In Models, choose Enable model downloads to install Ollama and download a local model. All downloads require approval.

          **Known limitations:** CI checks installation in an isolated PATH, not on a clean Windows VM. Local model flows remain unverified on end-user PCs; code signing and updates are not implemented. Native named-pipe IPC, full voice interaction, and sandboxed shell execution remain unfinished.

          Source is committed directly to main. SHA256SUMS.txt lists hashes for the installer downloads.
          '@ | Set-Content -Path 'preview-release-notes.md' -Encoding utf8
          $paths = @($assets | ForEach-Object { $_.FullName })
          $paths += (Resolve-Path 'SHA256SUMS.txt').Path
          $paths += (Resolve-Path 'installer-smoke.json').Path
          gh release create $tag @paths --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "AURIX $tag — Windows Preview" --notes-file 'preview-release-notes.md' --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw "GitHub preview release creation failed" }


# AURIX voice and communication preview gate: exact SHA CI, security and installed smoke required.
