name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Superseded main commits should not saturate Windows runners.
concurrency:
  group: aurix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo check --workspace
      # Packaging uses the release profile; catch Windows-only imports before installer builds.
      - run: cargo check --release --package aurix-desktop
      - run: cargo test --workspace

  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: pip install .[dev]
      - run: python -m compileall -q ai_brain ai_engine security native_ui frontend
      - run: pytest -q

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Select supported npm toolchain
        working-directory: frontend
        run: |
          npm install --global npm@11.6.0
          npm --version
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Compile frontend
        working-directory: frontend
        run: npm run build
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test
