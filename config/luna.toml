# LUNA System Configuration File (luna.toml)
# Target Hardware Profile: 16 GB Host RAM (12 GB Ceiling) & NVIDIA RTX 4060 8 GB VRAM (6 GB Ceiling)

[system]
app_name = "LUNA"
version = "0.2.0"
environment = "development"
log_level = "INFO"
log_dir = "data/logs"
data_dir = "data"

[security]
allowed_project_paths = [
    "G:/Websites By Ai/AURIX",
    "C:/Users/NAC/Documents/University/Projects",
    "C:/Users/NAC/Documents/University/Projects/Autonomous Universal Reasoning & Interaction Executive/AURIX"
]
file_jail_enabled = true
read_only_mode = false
trust_token_required = true
secret_scrubbing_enabled = true
encrypt_checkpoints_at_rest = true
append_only_audit_log = true

[security.permissions]
allow_file_read = true
allow_file_write = true
allow_shell_exec = true
allow_app_control = true
allow_local_search = true
# Dangerous operations require Trust Token interactive approval
require_trust_token_for_delete = true
require_trust_token_for_system_cmds = true
require_trust_token_for_checkpoint_restore = true

[resources]
# Static / baseline ceilings
max_ram_gb = 14.5               # Baseline host RAM ceiling (User has 16GB RAM)
max_vram_gb = 7.0               # Baseline discrete GPU VRAM ceiling (Active mode)
absolute_max_ram_gb = 15.5      # Hard emergency ceiling (never exceeded even at idle)
absolute_max_vram_gb = 7.8      # Hard emergency VRAM ceiling
cpu_throttle_percent = 85.0     # CPU usage throttle trigger
poll_interval_ms = 1000         # Governor watchdog polling cadence
suspend_on_overload = true
thermal_throttle_celsius = 82.0 # GPU core temperature ceiling

[power_governor]
# Adaptive idle-aware governor settings
idle_threshold_seconds = 300    # 5 minutes of no keyboard/mouse input triggers IDLE state
active_max_vram_gb = 7.0        # VRAM ceiling when user is actively working
idle_max_vram_gb = 7.5          # VRAM ceiling when machine is idle
active_max_ram_gb = 14.5        # RAM ceiling when active
idle_max_ram_gb = 15.2          # RAM ceiling when idle
active_lora_rank = 16           # Conservative LoRA rank during active usage
idle_lora_rank = 32             # Deeper LoRA rank during sustained idle/locked state
auto_hibernate_on_shutdown = true

[audio]
microphone = "Default"
whisper_model_path = "models/whisper/ggml-base.en.bin"
whisper_threads = 4
piper_model_path = "models/piper/en_US-lessac-medium.onnx"
piper_config_path = "models/piper/en_US-lessac-medium.onnx.json"
auto_tts_reply = true

[audio.wakeword]
enabled = true
keyword = "Luna"
sensitivity = 0.65
confirmation_echo = "Yes? Go ahead."
audio_sample_rate = 16000
chunk_size = 1280

[llm]
model_name = "google/gemma-4-E4B-it" # Primary reasoning / JARVIS brain foundation model (Google Gemma 4 E4B)
effective_params = "E4B"          # "E2B" (efficient 2B) or "E4B" (full 4B)
load_in_4bit = true
quantization = "nf4"
device = "cuda"
max_seq_length = 2048
temperature = 0.7
top_p = 0.9
fallback_mode = true

[training]
# Gemma 4 E4B acts as both the live assistant and the source of general-purpose training data;
# the student model is expected to be broadly competent, with the user's own real interactions
# contributing a smaller personalization layer on top.
student_base_model = "google/gemma-4-E4B-it"
checkpoint_dir = "checkpoints/luna-student"
auto_start_training_on_boot = false   # User explicitly presses 'Start Training' in UI
max_retained_checkpoints = 5          # Keep at least last 3-5 versioned checkpoints for rollback

# v0.4.1 Rebalanced training weights (General Usefulness, Not Personal Overfitting)
live_interaction_weight = 0.3         # Real usage still matters, but isn't the whole model (30% share)
synthetic_general_weight = 0.7        # General competence is now the larger base share (70% share)
experience_replay_ratio = 0.70        # Backward compatibility ratio (reflects 70% general knowledge)

eval_frequency_steps = 25
dataset_version = "v1.0"

[training.base]
micro_batch_size = 1
gradient_accumulation = 8
lora_r = 16
lora_alpha = 32
lora_target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
gradient_checkpointing = "unsloth"
optimizer = "paged_adamw_8bit"
quantization = "nf4"
max_seq_length = 2048
mixed_precision = "bf16"
flash_attention = true

[training.adaptive]
idle_micro_batch_size = 2
idle_gradient_accumulation = 4
idle_lora_r = 32
idle_lora_alpha = 64
cpu_activation_offloading = true
