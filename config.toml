# ═══════════════════════════════════════════════════════════════════════════
#  A.U.R.I.X Desktop AI Agent — Local System Configuration
# ═══════════════════════════════════════════════════════════════════════════

[security]

allowed_project_paths = [
    # Add trusted project roots on your own workstation; empty denies autonomous writes.
]

file_jail_enabled = true
read_only_mode = false
trust_token_required = true


[security.permissions]

require_trust_token_for_comms = true
require_trust_token_for_shell = true


[audio]

microphone = "Default"
whisper_model_path = "models/whisper/ggml-base.en.bin"
whisper_language = "en"
whisper_threads = 4
whisper_sample_rate = 16000
silence_limit = 2.2
initial_timeout = 10.0
min_speech_duration = 0.8
max_record_time = 35.0
voice = "Default"
piper_model_path = "models/piper/en_US-lessac-medium.onnx"
piper_config_path = "models/piper/en_US-lessac-medium.onnx.json"
piper_speed = 1.00
auto_tts_reply = true


[voice]
stt_model_path = "models/stt/whisper-base"
record_seconds = 6
sample_rate = 16000
tts_enabled = false

[memory]
enabled = false # Opt-in; requires Windows DPAPI.
max_retrieval_entries = 5
max_history_scan = 300

[resources]

# Adaptive pressure signals, not GPU/RAM allocation quotas.
min_free_ram_percent = 5.0
min_free_vram_percent = 5.0
gpu_busy_percent = 85.0
cpu_throttle_percent = 85.0
poll_interval_ms = 2500
suspend_on_overload = true


[general]
# The application never sends traffic unless you explicitly request an online action.
# Online action tools are not yet universally governed by this flag.
offline_mode = true

theme = "dark"
log_level = "info"
log_file = "logs/aurix_session.log"


[llm]
# Local GGUF model file, shipped separately by the user.
backend = "llama_cpp"
model_path = "models/gemma-3n-E4B-it-Q4_K_M.gguf"
fallback_model_path = ""
n_ctx = 2048
n_gpu_layers = -1 # Auto offload when supported by llama.cpp; retry on CPU otherwise.
model_unload_after_seconds = 120

model_name = "google/gemma-4-E4B-it" # legacy Transformers path; GGUF runtime pending
model_alias = "Gemma 4 E4B (4-bit NF4, GPU)"
effective_params = "E4B"
max_seq_length = 2048
load_in_4bit = true
quantization = "nf4"
device = "cuda"
temperature = 0.7
top_p = 0.9