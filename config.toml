# ═══════════════════════════════════════════════════════════════════════════
#  A.U.R.I.X Desktop AI Agent — Local System Configuration
# ═══════════════════════════════════════════════════════════════════════════

[security]

allowed_project_paths = [
    "G:/Websites By Ai/AURIX",
    "C:/Users/Zain/Projects"
]

file_jail_enabled = true
read_only_mode = false
trust_token_required = true


[security.permissions]

require_trust_token_for_comms = true
require_trust_token_for_shell = true


[audio]

microphone = "Default"
whisper_model_path = "models/whisper/ggml-base.en.bin"
whisper_language = "en"
whisper_threads = 4
whisper_sample_rate = 16000
silence_limit = 2.2
initial_timeout = 10.0
min_speech_duration = 0.8
max_record_time = 35.0
voice = "Default"
piper_model_path = "models/piper/en_US-lessac-medium.onnx"
piper_config_path = "models/piper/en_US-lessac-medium.onnx.json"
piper_speed = 1.00
auto_tts_reply = true


[resources]

max_ram_gb = 16.0
max_vram_gb = 6.0
cpu_throttle_percent = 85.0
poll_interval_ms = 1000
suspend_on_overload = true


[general]

theme = "dark"
offline_mode = true
log_level = "info"
log_file = "logs/aurix_session.log"


[llm]

model_name = "google/gemma-4-E4B-it"
model_alias = "Gemma 4 E4B (4-bit NF4, GPU)"
effective_params = "E4B"
max_seq_length = 2048
load_in_4bit = true
quantization = "nf4"
device = "cuda"
temperature = 0.7
top_p = 0.9